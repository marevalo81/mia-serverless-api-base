Resources:
  # ── Reusable access policies ─────────────────────────────

  DatabaseAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: ${self:service}-${self:provider.stage}-database-access
      Description: Allows Lambda functions to connect to the API PostgreSQL user using IAM authentication.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DatabaseConnect
            Effect: Allow
            Action:
              - rds-db:connect
            Resource:
              - Fn::Join:
                  - ""
                  - - "arn:aws:rds-db:"
                    - Ref: AWS::Region
                    - ":"
                    - Ref: AWS::AccountId
                    - ":dbuser:"
                    - ${self:custom.RDS_DB_RESOURCE_ID.${self:provider.stage}}
                    - "/"
                    - ${ssm:${self:custom.DB_USER.${self:provider.stage}}}
  # ── Lambda execution roles ───────────────────────────────

  # Role for Lambdas that only need basic CloudWatch logging.
  LambdaBasicExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Role for Lambdas that need VPC access and PostgreSQL.
  LambdaDatabaseExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        # CloudWatch Logs
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

        # VPC / ENI access
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

        # MIA database access
        - !Ref DatabaseAccessPolicy
